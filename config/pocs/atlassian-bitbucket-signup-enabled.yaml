id: atlassian-bitbucket-signup-enabled

info:
  name: Atlassian Bitbucket Public Signup Enabled
  author: bl
  severity: low
  description: |
    Atlassian Bitbucket is configured to allow public user registration.
    Attackers may be able to create accounts without administrator approval,
    increasing the attack surface of the application.
  impact: |
    Unauthorized users may register accounts and gain access to resources
    intended only for trusted users. This can facilitate reconnaissance,
    privilege abuse, or further attacks against the Bitbucket instance.
  remediation: |
    Disable public user registration if it is not required. Restrict account
    creation to administrators or approved identity providers and regularly
    audit user accounts.
  reference:
    - https://confluence.atlassian.com/bitbucketserver
    - https://support.atlassian.com/bitbucket-data-center/
  metadata:
    vendor: atlassian
    product: bitbucket
    max-request: 2
  tags: ATLASSIAN-Bitbucket

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /signup HTTP/1.1
        Host: {{Hostname}}

    redirects: false
    req-condition: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200
          - contains(body_1, "bitbucket/internal/page/login/login")
          - contains(body_1, "<a href=\"http://www.atlassian.com/\" target=\"_blank\">Atlassian</a>")
          - status_code_2 == 200
          - (contains(body_2, "Sign Up") || contains(body_2, "注册"))
        condition: and
