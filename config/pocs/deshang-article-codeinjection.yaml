id: deshang-article-codeinjection

info:
  name: DeShang /index.php?s=home/article/index - Code Injection
  author: qwtd
  severity: critical
  description: |
    DeShang is affected by a code injection vulnerability in /index.php?s=home/article/index.
    A remote attacker may inject malicious PHP code through crafted request parameters and cause
    arbitrary code execution on the server, potentially leading to webshell deployment and full server compromise.
  remediation: |
    - Upgrade to a vendor-fixed version or apply the official security patch as soon as possible.
    - Strictly validate and sanitize user-controlled parameters before they are processed by the application.
    - Disable dangerous PHP functions where possible and harden file write permissions on the web root.
    - Restrict public access to sensitive endpoints and monitor for unexpected PHP file creation.
    - Review logs and web directories for indicators of compromise, then rotate any exposed credentials.
  impact: |
    Successful exploitation may allow an unauthenticated attacker to execute arbitrary PHP code,
    write malicious files into the web root, deploy persistent webshells, steal sensitive data,
    and completely take over the affected server.
  reference: []
  classification:
    cwe-id: CWE-94
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
  metadata:
    vendor: deshang
    product: deshang
    verified: false
    max-request: 2
  tags: 德尚商城

