id: ecology-v9-getdata-sqli

info:
  name: Ecology v9 getdata - SQL Injection
  author: bl
  severity: high
  description: 泛微协同管理应用平台(e-cology)是一套兼具企业信息门户、知识文档管理、工作流程管理、人力资源管理、客户关系管理、项目管理、财务管理、资产管理、供应链管理、数据中心功能的企业大型协同管理平台。受影响版本中，/js/hrm/getdata.jsp 存在 SQL 注入漏洞，攻击者可利用该漏洞向数据库中注入任意SQL命令。
  reference:
    - https://github.com/YanC1e/ecology9_sqli/blob/cdf9d27cfc69b3d253ec87fd840a15e08b4727e3/ecology9_sqli.py
  tags: 泛微-协同办公OA
  metadata:
    verified: true
  classification:
    cwe-id: CWE-89

