# # Lightx 完整配置文件
# # 优先级：命令行参数 > 本地配置文件 > 嵌入默认配置

# # ============================================
# # 扫描全局配置
# # ============================================
# scan:
#   # 线程配置
#   thread: 100                    # 指纹扫描线程数
#   tcp_threads: 8000               # TCP端口扫描线程数

#   # 超时配置
#   timeout: 3                     # Web请求超时时间(秒)
#   tcp_timeout: 1                 # TCP端口扫描超时时间(秒)

#   # 端口扫描配置
#   port_range: "default"          # 默认端口范围
#   exclude_port: "9100,9103,9101,9102,25,110,9104,9105,9106,9107,515,143"  # 排除端口
#   ports_threshold: 800           # 端口阈值(超过认为是防火墙)
#   random_port: false             # 是否随机化端口扫描顺序

#   # 扫描模式
#   deep_scan: true                # 启用深度扫描
#   root_path: true                # 深度指纹扫描是否采用根路径
#   service_check: true            # 启用服务指纹识别
#   web_scan: true                 # 执行Web扫描
#   use_ping: false                # 禁用存活探测(false表示对所有IP扫描)

#   # 域名解析配置
#   domain_resolve: false          # 只进行域名解析
#   resolve_all: false             # 解析所有DNS记录类型
#   prefer_ipv6: false             # 优先使用IPv6地址
#   skip_cdn: false                # 跳过CDN保护的域名
#   force_real_ip: false           # 强制使用真实IP
#   disable_wildcard: false        # 禁用泛解析过滤

# # ============================================
# # 漏洞扫描配置
# # ============================================
# vulnerability:
#   # 扫描模式: more(多线程), one(单线程), false(禁用)
#   mode: "more"

#   # POC配置
#   template: ""                   # 模板文件或目录
#   nuclei_ids: ""                 # Nuclei模板ID过滤(逗号分隔)
#   tags: ""                       # POC标签
#   include_tags: ""               # 包含的POC标签
#   exclude_tags: "Nginx"  # 排除的POC标签

#   # 特定漏洞检测
#   log4j2: true                   # 启用Log4j2检查
#   api_directory_scan: false      # 启用API/备份文件扫描
#   disable_fastjson: false        # 禁用Fastjson探测
#   disable_shiro: false           # 禁用Shiro探测

#   # 无痕模式
#   stealth: false                 # 关闭所有主动探测

# # ============================================
# # 爬虫配置
# # ============================================
# crawler:
#   # 爬虫模式: auto(自动), static(静态), dynamic(动态), hybrid(混合), off(禁用)
#   mode: "auto"
#   debug: false                   # 爬虫调试模式
#   scan_urls: false               # 对爬虫发现的URL进行指纹扫描

# # ============================================
# # DNSLog配置
# # ============================================
# dnslog:
#   disable: false                 # 禁用DNSLog
#   server: ""                     # 自定义DNSLog服务器地址
#   token: ""                      # 自定义DNSLog授权令牌

# # ============================================
# # 代理配置
# # ============================================
# proxy:
#   enabled: false                 # 是否启用代理
#   url: ""                        # 代理地址 (http://127.0.0.1:8080 或 socks5://127.0.0.1:1080)

# # ============================================
# # 输出配置
# # ============================================
# output:
#   log_file: "log.txt"            # 日志文件路径
#   report_file: "report.html"     # HTML报告文件路径
#   config_delete: true            # 扫描完成后删除临时配置

# # ============================================
# # 调试配置
# # ============================================
# debug:
#   enabled: false                 # 启用调试模式
#   show_request: false            # 显示请求和响应数据包

# # ============================================
# # 插件配置
# # ============================================
# plugin:
#   enabled: true                  # 启用插件系统
#   module_name: ""                # 指定要调用的插件名称
#   plugin_params: ""              # 插件自定义参数
#   webfinger_concurrency: 0       # 漏洞插件并发数(0表示不限制)

# ============================================
# 爆破配置
